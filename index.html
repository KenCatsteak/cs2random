<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>CS2 內戰隨機分隊</title>
  <style>
    :root{
      --bg:#0b1020;--panel:#111827;--panel2:#0f172a;--line:#243047;
      --text:#f8fafc;--muted:#94a3b8;--accent:#f59e0b;--accent2:#fbbf24;
      --ct:#60a5fa;--t:#f59e0b;--danger:#f87171;--ok:#34d399;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at 15% 15%,rgba(245,158,11,.10),transparent 28%),
        radial-gradient(circle at 85% 10%,rgba(96,165,250,.10),transparent 28%),
        var(--bg);
    }
    .wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:40px 0 56px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
    h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em}
    .subtitle{color:var(--muted);margin-top:8px}
    .badge{
      border:1px solid var(--line);background:rgba(17,24,39,.8);color:var(--accent2);
      padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap
    }
    .grid{display:grid;grid-template-columns:390px 1fr;gap:20px}
    .card{
      background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(15,23,42,.96));
      border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)
    }
    .pad{padding:20px}
    .section-title{font-size:14px;color:#cbd5e1;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}
    textarea{
      width:100%;min-height:230px;resize:vertical;border-radius:14px;border:1px solid var(--line);
      background:#09111f;color:var(--text);padding:14px;font:inherit;line-height:1.55;outline:none
    }
    textarea:focus{border-color:#475569;box-shadow:0 0 0 3px rgba(148,163,184,.08)}
    .hint{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
    .counter{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted)}
    .counter strong{color:var(--text)}
    .maps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .map-option{
      display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);
      border-radius:10px;background:#0b1324;font-size:14px;cursor:pointer;user-select:none
    }
    input[type=checkbox]{accent-color:var(--accent)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    button{
      border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;
      transition:.15s transform,.15s opacity,.15s background
    }
    button:hover{transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    .primary{background:var(--accent);color:#171717}
    .secondary{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
    .ghost{background:transparent;color:#cbd5e1;border:1px solid var(--line)}
    button:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .result{padding:20px;min-height:560px}
    .empty{
      min-height:500px;display:grid;place-items:center;text-align:center;color:var(--muted);
      border:1px dashed #334155;border-radius:14px;padding:24px
    }
    .map-hero{
      border:1px solid var(--line);background:#0a1222;border-radius:16px;padding:18px;
      display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px
    }
    .map-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
    .map-name{font-size:26px;font-weight:800;margin-top:2px}
    .teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .team{border:1px solid var(--line);background:#0a1222;border-radius:16px;overflow:hidden}
    .team-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .team-name{font-weight:800;font-size:18px}
    .side{font-weight:900;font-size:13px;padding:5px 9px;border-radius:999px}
    .side.ct{background:rgba(96,165,250,.14);color:var(--ct);border:1px solid rgba(96,165,250,.28)}
    .side.t{background:rgba(245,158,11,.14);color:var(--t);border:1px solid rgba(245,158,11,.28)}
    .players{list-style:none;padding:8px;margin:0}
    .players li{
      display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px
    }
    .players li:nth-child(odd){background:rgba(148,163,184,.035)}
    .num{width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
    .subs{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#0a1222}
    .subs-title{font-size:13px;color:var(--muted);margin-bottom:8px}
    .subs-list{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:7px 10px;background:#162033;border:1px solid #2a3850;border-radius:999px;font-size:13px}
    .server{
      margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      border:1px solid var(--line);border-radius:14px;padding:14px;background:#07101e
    }
    code{color:#fde68a;font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace;font-size:13px;word-break:break-all}
    .result-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .notice{margin-top:10px;min-height:20px;font-size:13px;color:var(--ok)}
    .error{color:var(--danger)}
    footer{text-align:center;color:#64748b;font-size:12px;margin-top:20px}
    @media(max-width:850px){
      .grid{grid-template-columns:1fr}
      .teams{grid-template-columns:1fr}
      .result-actions{grid-template-columns:1fr}
      header{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>CS2 內戰隨機分隊</h1>
        <div class="subtitle">貼上玩家名單，一鍵完成 5v5 分隊、CT/T 與地圖抽選。</div>
      </div>
      <div class="badge">CS2 INHOUSE RANDOMIZER</div>
    </header>

    <section class="grid">
      <aside class="card pad">
        <p class="section-title">玩家名單</p>
        <textarea id="players" placeholder="每行一位，或用逗號分隔&#10;&#10;例如：&#10;Heng&#10;Jack&#10;Kevin&#10;Alex&#10;Tom&#10;Ken&#10;David&#10;Leo&#10;Eric&#10;Sam"></textarea>
        <div class="counter">
          <span>至少需要 10 位玩家</span>
          <span>目前 <strong id="playerCount">0</strong> 人</span>
        </div>

        <p class="section-title" style="margin-top:22px">地圖池</p>
        <div class="maps" id="mapPool"></div>
        <div class="hint">取消勾選即可排除該地圖。至少保留 1 張。</div>

        <div class="actions">
          <button class="primary" id="drawBtn">隨機抽選</button>
          <button class="secondary" id="clearBtn">清空名單</button>
        </div>
        <div class="notice" id="formNotice"></div>
      </aside>

      <section class="card result">
        <div id="emptyState" class="empty">
          <div>
            <div style="font-size:40px;margin-bottom:10px">5v5</div>
            <strong style="color:#e2e8f0">等待抽選</strong>
            <div style="margin-top:6px">輸入至少 10 位玩家後按「隨機抽選」。</div>
          </div>
        </div>

        <div id="resultState" hidden>
          <div class="map-hero">
            <div>
              <div class="map-label">Selected Map</div>
              <div class="map-name" id="selectedMap">—</div>
            </div>
            <button class="ghost" id="rerollMapBtn">重抽地圖</button>
          </div>

          <div class="teams">
            <article class="team">
              <div class="team-head">
                <div class="team-name">Team A</div>
                <div class="side" id="sideA">CT</div>
              </div>
              <ol class="players" id="teamA"></ol>
            </article>

            <article class="team">
              <div class="team-head">
                <div class="team-name">Team B</div>
                <div class="side" id="sideB">T</div>
              </div>
              <ol class="players" id="teamB"></ol>
            </article>
          </div>

          <div class="subs" id="subsBox" hidden>
            <div class="subs-title">候補</div>
            <div class="subs-list" id="subsList"></div>
          </div>

          <div class="server">
            <div>
              <div class="map-label">Server Command</div>
              <code id="serverCommand">changelevel de_mirage</code>
            </div>
            <button class="ghost" id="copyCommandBtn">複製</button>
          </div>

          <div class="result-actions">
            <button class="primary" id="rerollTeamsBtn">重新分隊</button>
            <button class="secondary" id="swapSidesBtn">交換 CT / T</button>
            <button class="secondary" id="copyDiscordBtn">複製 Discord 格式</button>
          </div>
          <div class="notice" id="resultNotice"></div>
        </div>
      </section>
    </section>

    <footer>資料只保存在你的瀏覽器，不會上傳玩家名單。</footer>
  </main>

  <script>
    const MAPS = [
      "de_mirage","de_inferno","de_dust2","de_nuke",
      "de_ancient","de_anubis","de_train","de_overpass"
    ];

    const els = {
      players: document.querySelector("#players"),
      playerCount: document.querySelector("#playerCount"),
      mapPool: document.querySelector("#mapPool"),
      drawBtn: document.querySelector("#drawBtn"),
      clearBtn: document.querySelector("#clearBtn"),
      formNotice: document.querySelector("#formNotice"),
      emptyState: document.querySelector("#emptyState"),
      resultState: document.querySelector("#resultState"),
      selectedMap: document.querySelector("#selectedMap"),
      sideA: document.querySelector("#sideA"),
      sideB: document.querySelector("#sideB"),
      teamA: document.querySelector("#teamA"),
      teamB: document.querySelector("#teamB"),
      subsBox: document.querySelector("#subsBox"),
      subsList: document.querySelector("#subsList"),
      serverCommand: document.querySelector("#serverCommand"),
      rerollMapBtn: document.querySelector("#rerollMapBtn"),
      rerollTeamsBtn: document.querySelector("#rerollTeamsBtn"),
      swapSidesBtn: document.querySelector("#swapSidesBtn"),
      copyDiscordBtn: document.querySelector("#copyDiscordBtn"),
      copyCommandBtn: document.querySelector("#copyCommandBtn"),
      resultNotice: document.querySelector("#resultNotice")
    };

    let state = {
      activePool: [],
      teamA: [],
      teamB: [],
      subs: [],
      map: "",
      sideA: "CT",
      sideB: "T"
    };

    function initMaps(){
      const saved = JSON.parse(localStorage.getItem("cs2_maps") || "null");
      MAPS.forEach(map => {
        const label = document.createElement("label");
        label.className = "map-option";
        const checked = saved ? saved.includes(map) : true;
        label.innerHTML = '<input type="checkbox" value="' + map + '" ' + (checked ? "checked" : "") + '> <span>' + map.replace("de_","") + '</span>';
        els.mapPool.appendChild(label);
      });
    }

    function parsePlayers(){
      const raw = els.players.value.split(/[\n,，;；]+/).map(x => x.trim()).filter(Boolean);
      const seen = new Set();
      return raw.filter(name => {
        const key = name.toLowerCase();
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function selectedMaps(){
      return [...document.querySelectorAll("#mapPool input:checked")].map(x => x.value);
    }

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function updateCount(){
      els.playerCount.textContent = parsePlayers().length;
      localStorage.setItem("cs2_players", els.players.value);
    }

    function setNotice(el, msg, isError=false){
      el.textContent = msg;
      el.classList.toggle("error", isError);
      if(msg) setTimeout(() => { if(el.textContent === msg) el.textContent = ""; }, 2200);
    }

    function setSideBadge(el, side){
      el.textContent = side;
      el.className = "side " + side.toLowerCase();
    }

    function renderPlayers(el, list){
      el.innerHTML = "";
      list.forEach((name,i) => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="num">' + (i+1) + '.</span><span>' + escapeHtml(name) + '</span>';
        el.appendChild(li);
      });
    }

    function escapeHtml(str){
      return str.replace(/[&<>"']/g, ch => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      })[ch]);
    }

    function render(){
      els.emptyState.hidden = true;
      els.resultState.hidden = false;
      els.selectedMap.textContent = state.map;
      setSideBadge(els.sideA, state.sideA);
      setSideBadge(els.sideB, state.sideB);
      renderPlayers(els.teamA, state.teamA);
      renderPlayers(els.teamB, state.teamB);
      els.serverCommand.textContent = "changelevel " + state.map;

      els.subsList.innerHTML = "";
      state.subs.forEach(name => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = name;
        els.subsList.appendChild(chip);
      });
      els.subsBox.hidden = state.subs.length === 0;
    }

    function drawAll(){
      const players = parsePlayers();
      const maps = selectedMaps();

      if(players.length < 10){
        setNotice(els.formNotice, "至少需要 10 位不同的玩家。", true);
        return;
      }
      if(maps.length === 0){
        setNotice(els.formNotice, "地圖池至少要保留 1 張地圖。", true);
        return;
      }

      localStorage.setItem("cs2_maps", JSON.stringify(maps));

      const shuffled = shuffle(players);
      state.activePool = shuffled.slice(0,10);
      state.teamA = state.activePool.slice(0,5);
      state.teamB = state.activePool.slice(5,10);
      state.subs = shuffled.slice(10);
      state.map = pick(maps);

      if(Math.random() < .5){
        state.sideA = "CT"; state.sideB = "T";
      } else {
        state.sideA = "T"; state.sideB = "CT";
      }
      render();
    }

    function rerollTeams(){
      if(state.activePool.length !== 10) return;
      const shuffled = shuffle(state.activePool);
      state.teamA = shuffled.slice(0,5);
      state.teamB = shuffled.slice(5,10);
      render();
    }

    function rerollMap(){
      const maps = selectedMaps();
      if(maps.length === 0){
        setNotice(els.resultNotice,"地圖池至少要保留 1 張。",true); return;
      }
      if(maps.length === 1){ state.map = maps[0]; }
      else {
        const alternatives = maps.filter(m => m !== state.map);
        state.map = pick(alternatives.length ? alternatives : maps);
      }
      render();
    }

    function swapSides(){
      [state.sideA,state.sideB] = [state.sideB,state.sideA];
      render();
    }

    function discordText(){
      const lines = [
        "【CS2 內戰】",
        "",
        "地圖：" + state.map,
        "",
        "Team A (" + state.sideA + ")",
        ...state.teamA.map((p,i) => (i+1) + ". " + p),
        "",
        "Team B (" + state.sideB + ")",
        ...state.teamB.map((p,i) => (i+1) + ". " + p)
      ];
      if(state.subs.length){
        lines.push("", "候補", ...state.subs.map((p,i) => (i+1) + ". " + p));
      }
      lines.push("", "Server：", "changelevel " + state.map);
      return lines.join("\n");
    }

    async function copy(text, notice="已複製到剪貼簿。"){
      try{
        await navigator.clipboard.writeText(text);
        setNotice(els.resultNotice, notice);
      }catch{
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
        setNotice(els.resultNotice, notice);
      }
    }

    els.players.value = localStorage.getItem("cs2_players") || "";
    initMaps();
    updateCount();

    els.players.addEventListener("input", updateCount);
    els.drawBtn.addEventListener("click", drawAll);
    els.rerollTeamsBtn.addEventListener("click", rerollTeams);
    els.rerollMapBtn.addEventListener("click", rerollMap);
    els.swapSidesBtn.addEventListener("click", swapSides);
    els.copyDiscordBtn.addEventListener("click", () => copy(discordText(),"Discord 格式已複製。"));
    els.copyCommandBtn.addEventListener("click", () => copy(els.serverCommand.textContent,"Server 指令已複製。"));
    els.clearBtn.addEventListener("click", () => {
      els.players.value = "";
      updateCount();
      localStorage.removeItem("cs2_players");
      els.emptyState.hidden = false;
      els.resultState.hidden = true;
      setNotice(els.formNotice,"名單已清空。");
    });
  </script>
</body>
</html>
